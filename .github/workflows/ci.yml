name: Validacao e pacote VSIX

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes, compilacao e VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Instalar dependencias da extensao
        working-directory: vscode-extension
        run: npm ci

      - name: Compilar extensao
        working-directory: vscode-extension
        run: npm run compile

      - name: Gerar pacote VSIX
        working-directory: vscode-extension
        run: npm run package

      - name: Publicar pacote para download
        uses: actions/upload-artifact@v7
        with:
          name: privacy-scanner-lgpd-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30
