name: Validacao e pacote VSIX

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Testes, compilacao e VSIX
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vscode-version: ["1.85.2", "1.128.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias Python
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Instalar dependencias da extensao
        working-directory: vscode-extension
        run: npm ci

      - name: Compilar extensao
        working-directory: vscode-extension
        run: npm test

      - name: Testar no Extension Host (Linux)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:integration

      - name: Testar no Extension Host (Windows)
        if: runner.os == 'Windows'
        working-directory: vscode-extension
        run: npm run test:integration

      - name: Gerar pacote VSIX
        working-directory: vscode-extension
        run: npm run package

      - name: Instalar VSIX em ambiente isolado
        working-directory: vscode-extension
        run: npm run test:vsix

      - name: Publicar pacote para download
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: privacy-scanner-lgpd-vsix-${{ matrix.vscode-version }}
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30
