[pytest]
# pytest configuration for Privacy Scanner tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests combining multiple components
    slow: Tests that take longer to run
    database: Tests involving database operations
    filesystem: Tests involving filesystem operations

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=. --cov-report=html

testpaths = tests
